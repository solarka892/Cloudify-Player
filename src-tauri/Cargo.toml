[package]
name = "cloudify-player"
version = "0.1.0"
description = "Unofficial cross-platform SoundCloud desktop client"
authors = ["solarka892"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on
# Windows, see https://github.com/rust-lang/cargo/issues/8519).
name = "cloudify_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP + async are added once we implement sc_api::client_id (MVP #3):
#   reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
#   tokio   = { version = "1", features = ["macros", "rt-multi-thread"] }
#   regex   = "1"
# Kept out for now so the skeleton builds fast and clean.
