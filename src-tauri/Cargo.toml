[package]
name = "cloudify-player"
version = "0.2.0"
description = "Unofficial cross-platform SoundCloud desktop client"
authors = ["solarka892"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on
# Windows, see https://github.com/rust-lang/cargo/issues/8519).
name = "cloudify_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` lets the webview play downloaded files straight off disk.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SoundCloud api-v2 client (sc_api). reqwest uses rustls to avoid an OpenSSL
# system dependency; async requests run on Tauri's ambient tokio runtime.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "charset",
    "gzip",
    "brotli",
    "json",
] }
regex = "1"
thiserror = "2"

# For the login-cookie polling loop (Tauri's async runtime provides the driver).
tokio = { version = "1", features = ["time", "rt"] }

# Tag downloaded mp3s (title/artist + embedded cover) so they make sense in
# any other player too.
id3 = "1"

# Index of downloaded tracks. Bundled = no system SQLite dependency; on Android
# it is cross-compiled by the NDK's clang.
rusqlite = { version = "0.32", features = ["bundled"] }

# The browser sign-in flow — opening the user's own browser and reading the
# `oauth_token` cookie back out of its profile — has no meaning on Android:
# there is no other browser whose cookie store we could reach.
[target.'cfg(not(target_os = "android"))'.dependencies]
# OAuth token storage. Secret Service on Linux (persistent, needs a running
# provider e.g. gnome-keyring), native stores on macOS/Windows. No Android
# backend exists, which is why `auth::store` bridges to Kotlin there.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# Open a URL in the user's default browser, correctly on all three platforms.
open = "5"

# Reaching the WebKitGTK settings behind the webview, to turn off its own
# wheel-scroll animation (see `platform`). Pinned to the version wry already
# links, so there is only ever one set of GTK bindings in the build.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[dev-dependencies]
# Network smoke tests for the api-v2 client are `#[ignore]`d by default; run
# them with `cargo test -- --ignored` when SoundCloud's API might have shifted.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
