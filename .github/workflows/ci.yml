name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust (fmt, clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build needs the WebKitGTK stack; keyring needs D-Bus.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --check
        working-directory: src-tauri

      # CLAUDE.md: the Rust core ships with zero clippy warnings.
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  # The Android-only code (`src/android/`, and the `cfg` branches in `auth` and
  # `media`) is invisible to the host build, so nothing above compiles a line of
  # it. This is the cheap half of catching that: type-check for the Android target
  # without gradle, an SDK, or an APK.
  android:
    name: Rust (Android target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      # rusqlite bundles SQLite's C source, so even `clippy` needs a cross
      # compiler to run the build script. The runners ship an NDK already.
      - name: Point cc and the linker at the NDK
        run: |
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android24-clang"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
          } >> "$GITHUB_ENV"

      # `--lib` only: the integration tests are desktop-shaped and there is no
      # device here to run anything on regardless.
      - run: cargo clippy --lib --target aarch64-linux-android -- -D warnings
        working-directory: src-tauri
