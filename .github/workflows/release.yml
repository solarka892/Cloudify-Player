name: Release

# Tag a release to build installers:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.label }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (not latest) on purpose: glibc there is old enough for
          # the artifacts to run on older distros too.
          - platform: ubuntu-22.04
            label: Linux (.AppImage, .deb, .rpm)
            args: ""
          - platform: windows-latest
            label: Windows (.exe, .msi)
            args: ""
          # One universal binary rather than two downloads: it carries both
          # Apple Silicon and Intel slices, and Tauri builds it in one pass.
          - platform: macos-latest
            label: macOS (.dmg, universal)
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal binary needs both Apple targets present.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      # Runs `pnpm build` (tauri.conf.json beforeBuildCommand) + `tauri build`,
      # then uploads every bundle to a draft GitHub release for the tag.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cloudify Player ${{ github.ref_name }}
          releaseBody: |
            Unofficial SoundCloud client. Not affiliated with SoundCloud. Use at your own risk.

            Linux: `.AppImage` (portable), `.deb`, `.rpm`.
            Windows: `.exe` (NSIS installer) or `.msi`.
            macOS: `.dmg` (universal — Apple Silicon and Intel).

            The macOS build is **not code-signed**, so Gatekeeper will refuse it
            on first launch. Either right-click the app and choose Open, or run
            `xattr -cr /Applications/cloudify.app` once.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Separate from the matrix above: tauri-action does not build Android, and this
  # needs a JDK, an SDK, an NDK and four Rust targets that the desktop jobs have
  # no use for.
  android:
    name: Build Android (.apk)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - uses: android-actions/setup-android@v3

      # Pinned rather than "latest": the NDK decides the libc the Rust core links
      # against, and a silent bump is not something to discover in a release.
      - name: Install NDK and platform
        run: |
          sdkmanager --install "ndk;27.1.12297006" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # Unsigned APKs cannot be installed, so without these secrets the artifact
      # would be useless — better to say so than to publish something broken.
      # Generate with: base64 -w0 cloudify-release.jks
      - name: Write the signing config
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — see docs/android.md"
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > src-tauri/gen/android/cloudify-release.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=cloudify-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # One APK carrying all four ABIs. Bigger than a per-ABI split, but it is a
      # single link on a release page that works on any phone.
      - run: pnpm tauri android build --apk

      - name: Check the APK is signed
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release*.apk" | head -1)
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$apk"
          mv "$apk" "cloudify-${{ github.ref_name }}.apk"

      # Appends to the draft the desktop matrix creates for this tag, or creates
      # it if Android happens to finish first.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cloudify Player ${{ github.ref_name }}
          draft: true
          files: cloudify-${{ github.ref_name }}.apk
