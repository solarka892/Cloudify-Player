name: Release

# Tag a release to build installers:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.label }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (not latest) on purpose: glibc there is old enough for
          # the artifacts to run on older distros too.
          - platform: ubuntu-22.04
            label: Linux (.AppImage, .deb, .rpm)
            args: ""
          - platform: windows-latest
            label: Windows (.exe, .msi)
            args: ""
          # One universal binary rather than two downloads: it carries both
          # Apple Silicon and Intel slices, and Tauri builds it in one pass.
          - platform: macos-latest
            label: macOS (.dmg, universal)
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal binary needs both Apple targets present.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      # Runs `pnpm build` (tauri.conf.json beforeBuildCommand) + `tauri build`,
      # then uploads every bundle to a draft GitHub release for the tag.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cloudify Player ${{ github.ref_name }}
          releaseBody: |
            Unofficial SoundCloud client. Not affiliated with SoundCloud. Use at your own risk.

            Linux: `.AppImage` (portable), `.deb`, `.rpm`.
            Windows: `.exe` (NSIS installer) or `.msi`.
            macOS: `.dmg` (universal — Apple Silicon and Intel).

            The macOS build is **not code-signed**, so Gatekeeper will refuse it
            on first launch. Either right-click the app and choose Open, or run
            `xattr -cr /Applications/cloudify.app` once.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
