<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-*)` report anything
      on a phone with a cutout; without it the Android build's edge-to-edge layout
      puts the top row under the status bar.

      Zoom is off because this is an application, not a document: a double-tap on
      a track row means "play", and pinch-zooming a fixed-position player bar
      leaves it stranded. Text still scales with the OS font-size setting.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <!--
      Only the dev server and `vite preview` ever show this: a packaged Tauri
      window has no tab and takes its icon from `src-tauri/icons`. It is here so
      that the one place the app appears in a browser is not the generic globe.
      Same master image as the app icon — see `assets/icon-master.svg`.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>cloudify</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
